<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Life & Origins</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: black;
            margin: 0;
            padding: 0;
            overflow: hidden;
            color: white;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .origin-glow {
            filter: drop-shadow(0 0 15px rgba(59, 130, 246, 0.4));
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;

        const Icons = {
            Flame: () => (
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{color: 'rgb(249, 115, 22)'}}>
                    <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
                </svg>
            ),
            Droplets: () => (
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{color: 'rgb(59, 130, 246)'}}>
                    <path d="M7 16.3c2.2 0 4-1.8 4-4 0-3.3-4-6-4-6s-4 2.7-4 6c0 2.2 1.8 4 4 4Z"/><path d="M17 14.3c1.7 0 3-1.3 3-3 0-2.5-3-4.5-3-4.5s-3 2-3 4.5c0 1.7 1.3 3 3 3Z"/><path d="M13 20.3c1.1 0 2-.9 2-2 0-1.7-2-3-2-3s-2 1.3-2 3c0 1.1.9 2 2 2Z"/>
                </svg>
            ),
            Wind: () => (
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{color: 'rgb(203, 213, 225)'}}>
                    <path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/>
                </svg>
            ),
            Mountain: () => (
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{color: 'rgb(4, 120, 87)'}}>
                    <path d="m8 3 4 8 5-5 5 15H2L8 3z"/>
                </svg>
            ),
            Zap: () => (
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{color: 'rgb(34, 211, 238)'}}>
                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                </svg>
            ),
            Globe: () => (
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{color: 'rgb(96, 165, 250)'}}>
                    <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                </svg>
            ),
            Trash: () => (
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>
                </svg>
            ),
            Loader: () => (
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="animate-spin">
                    <line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/>
                </svg>
            )
        };

        const createAudioEngine = () => {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            const ctx = new AudioContext();
            const masterGain = ctx.createGain();
            masterGain.gain.value = 0.12; 
            masterGain.connect(ctx.destination);

            return {
                spawn: () => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(330, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(110, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.4, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                    osc.connect(gain);
                    gain.connect(masterGain);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.15);
                },
                merge: () => {
                    const now = ctx.currentTime;
                    [220, 440, 880].forEach((freq, i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now + (i * 0.04));
                        gain.gain.setValueAtTime(0, now + (i * 0.04));
                        gain.gain.linearRampToValueAtTime(0.2, now + (i * 0.04) + 0.03);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                        osc.connect(gain);
                        gain.connect(masterGain);
                        osc.start(now + (i * 0.04));
                        osc.stop(now + 0.5);
                    });
                },
                clear: () => {
                    const bufferSize = ctx.sampleRate * 0.4;
                    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                    const noise = ctx.createBufferSource();
                    noise.buffer = buffer;
                    const filter = ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(800, ctx.currentTime);
                    filter.frequency.exponentialRampToValueAtTime(10, ctx.currentTime + 0.4);
                    const gain = ctx.createGain();
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(masterGain);
                    noise.start();
                },
                resume: () => {
                    if (ctx.state === 'suspended') ctx.resume();
                }
            };
        };

        const triggerHaptic = () => {
            if ('vibrate' in navigator) {
                navigator.vibrate(10);
            }
        };

        const apiKey = ""; 

        const INITIAL_ELEMENTS = [
            { id: 'fire', name: 'Fire', icon: <Icons.Flame />, color: 'from-orange-600 to-red-600' },
            { id: 'water', name: 'Water', icon: <Icons.Droplets />, color: 'from-blue-600 to-cyan-600' },
            { id: 'air', name: 'Air', icon: <Icons.Wind />, color: 'from-slate-400 to-slate-200' },
            { id: 'earth', name: 'Earth', icon: <Icons.Mountain />, color: 'from-emerald-800 to-amber-900' },
        ];

        const COMBINATIONS = {
            'fire+water': { id: 'steam', name: 'Steam' },
            'fire+earth': { id: 'lava', name: 'Lava' },
            'water+earth': { id: 'mud', name: 'Mud' },
            'air+earth': { id: 'dust', name: 'Dust' },
            'fire+air': { id: 'energy', name: 'Energy' },
            'water+air': { id: 'mist', name: 'Mist' },
            'lava+water': { id: 'obsidian', name: 'Obsidian' },
            'steam+air': { id: 'cloud', name: 'Cloud' },
            'earth+earth': { id: 'stone', name: 'Stone' },
            'fire+stone': { id: 'metal', name: 'Metal' },
            'mud+fire': { id: 'brick', name: 'Brick' },
            'air+energy': { id: 'storm', name: 'Storm' },
            'water+energy': { id: 'life', name: 'Life' },
            'life+earth': { id: 'plant', name: 'Plant' },
            'life+water': { id: 'algae', name: 'Algae' },
            'stone+stone': { id: 'mountain_range', name: 'Mountain Range' },
            'life+stone': { id: 'fossil', name: 'Fossil' },
        };

        const App = () => {
            const [discovered, setDiscovered] = useState(INITIAL_ELEMENTS);
            const [workspace, setWorkspace] = useState([]);
            const [images, setImages] = useState({});
            const [generatingId, setGeneratingId] = useState(null);
            const [lastDiscovery, setLastDiscovery] = useState(null);
            const workspaceRef = useRef(null);
            const audio = useRef(null);

            useEffect(() => {
                audio.current = createAudioEngine();
            }, []);

            const generateVisual = async (elementName, retries = 5) => {
                if (images[elementName]) return;
                setGeneratingId(elementName);

                const executeRequest = async (attempt) => {
                    try {
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                instances: { 
                                    prompt: `A high-resolution cinematic 3D macro render of '${elementName}'. Dark atmospheric background, artistic lighting, detailed textures, octane render style, magical aura, 8k.` 
                                },
                                parameters: { sampleCount: 1 }
                            })
                        });
                        if (!response.ok) throw new Error('Generation failed');
                        const result = await response.json();
                        if (result.predictions?.[0]?.bytesBase64Encoded) {
                            return `data:image/png;base64,${result.predictions[0].bytesBase64Encoded}`;
                        }
                        throw new Error('No data');
                    } catch (e) {
                        if (attempt < retries) {
                            await new Promise(r => setTimeout(r, Math.pow(2, attempt) * 1000));
                            return executeRequest(attempt + 1);
                        }
                        throw e;
                    }
                };

                try {
                    const imageUrl = await executeRequest(0);
                    setImages(prev => ({ ...prev, [elementName]: imageUrl }));
                } catch (e) {
                    console.error(e);
                } finally {
                    setGeneratingId(null);
                }
            };

            const addInstance = (element) => {
                audio.current?.resume();
                audio.current?.spawn();
                const rect = workspaceRef.current?.getBoundingClientRect();
                const newItem = {
                    ...element,
                    instanceId: Math.random().toString(36).substr(2, 9),
                    x: rect ? (rect.width / 2) - 40 : 150,
                    y: rect ? (rect.height / 2) - 40 : 150,
                };
                setWorkspace(prev => [...prev, newItem]);
            };

            const handleMerge = (movedItem, currentWorkspace) => {
                const target = currentWorkspace.find(item => 
                    item.instanceId !== movedItem.instanceId && 
                    Math.abs(item.x - movedItem.x) < 80 && 
                    Math.abs(item.y - movedItem.y) < 80
                );

                if (target) {
                    const key1 = `${movedItem.id}+${target.id}`;
                    const key2 = `${target.id}+${movedItem.id}`;
                    const result = COMBINATIONS[key1] || COMBINATIONS[key2];

                    if (result) {
                        audio.current?.merge();
                        const isNew = !discovered.find(e => e.id === result.id);
                        const newElem = { ...result, icon: <Icons.Zap />, color: 'from-blue-500 to-indigo-600' };
                        
                        if (isNew) {
                            setDiscovered(prev => [...prev, newElem]);
                            generateVisual(newElem.name);
                            setLastDiscovery(newElem);
                            triggerHaptic();
                            setTimeout(() => setLastDiscovery(null), 3500);
                        }

                        const centerX = (movedItem.x + target.x) / 2;
                        const centerY = (movedItem.y + target.y) / 2;
                        
                        setWorkspace(prev => prev.filter(i => i.instanceId !== movedItem.instanceId && i.instanceId !== target.instanceId));
                        setWorkspace(prev => [...prev, {
                            ...newElem,
                            instanceId: Math.random().toString(36).substr(2, 9),
                            x: centerX,
                            y: centerY
                        }]);
                        return true;
                    }
                }
                return false;
            };

            const updatePosition = (id, x, y) => {
                setWorkspace(prev => {
                    const updated = prev.map(item => item.instanceId === id ? { ...item, x, y } : item);
                    const movedItem = updated.find(i => i.instanceId === id);
                    if (movedItem) handleMerge(movedItem, updated);
                    return updated;
                });
            };

            const clearWorkspace = () => {
                audio.current?.clear();
                setWorkspace([]);
            };

            return (
                <div className="flex h-screen w-screen bg-black text-white overflow-hidden select-none touch-none" onClick={() => audio.current?.resume()}>
                    <aside className="w-16 md:w-20 bg-zinc-950 border-r border-white/5 flex flex-col items-center py-8 gap-6 z-50 overflow-y-auto no-scrollbar">
                        <div className="mb-4 relative">
                            <div className="absolute inset-0 bg-blue-500/10 blur-xl animate-pulse rounded-full"></div>
                            <Icons.Globe />
                        </div>
                        <div className="hidden md:flex flex-col items-center gap-2 mb-4">
                            <span className="text-[9px] font-black text-white/10 vertical-text tracking-[0.6em] uppercase rotate-180">LIFE</span>
                            <div className="w-[1px] h-12 bg-white/5"></div>
                            <span className="text-[9px] font-black text-white/10 vertical-text tracking-[0.6em] uppercase rotate-180">ORIGINS</span>
                        </div>
                        {discovered.map((element) => (
                            <button key={element.id} onClick={() => addInstance(element)} className="flex flex-col items-center gap-1.5 active:scale-90 transition-transform group">
                                <div className="w-10 h-10 md:w-12 md:h-12 bg-white/[0.03] border border-white/10 rounded-xl flex items-center justify-center group-hover:bg-white/10 overflow-hidden relative transition-colors">
                                    {images[element.name] ? (
                                        <img src={images[element.name]} className="w-full h-full object-cover origin-glow" alt={element.name} />
                                    ) : (
                                        <div className="group-hover:scale-110 transition-transform opacity-60 group-hover:opacity-100">{element.icon}</div>
                                    )}
                                    {generatingId === element.name && (
                                        <div className="absolute inset-0 bg-black/70 flex items-center justify-center"><Icons.Loader /></div>
                                    )}
                                </div>
                                <span className="text-[7px] font-black tracking-widest uppercase text-zinc-600 group-hover:text-blue-400 truncate max-w-full px-1">{element.name}</span>
                            </button>
                        ))}
                        <div className="mt-auto pt-6 border-t border-white/5 w-full flex flex-col items-center">
                            <button onClick={clearWorkspace} className="p-2 text-zinc-700 hover:text-red-500 transition-colors">
                                <Icons.Trash />
                            </button>
                        </div>
                    </aside>

                    <main ref={workspaceRef} className="flex-1 relative bg-[radial-gradient(circle_at_50%_50%,_#0a0a0c_0%,_#000_100%)] overflow-hidden">
                        <div className="absolute inset-0 opacity-[0.02] pointer-events-none" style={{ backgroundImage: 'radial-gradient(rgb(255,255,255) 1px, transparent 1px)', backgroundSize: '40px 40px' }}></div>
                        <div className="absolute top-8 left-8 pointer-events-none md:hidden opacity-20"><h1 className="text-xl font-black italic tracking-tighter uppercase">Life & Origins</h1></div>
                        {workspace.length === 0 && (
                            <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none px-12 text-center opacity-20">
                                <div className="w-32 h-32 rounded-full border border-white/5 flex items-center justify-center mb-8"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div>
                                <p className="text-[10px] font-black tracking-[0.6em] uppercase">Manifest an element to begin</p>
                            </div>
                        )}
                        {workspace.map((item) => (
                            <DraggableElement key={item.instanceId} item={item} allElements={workspace} onUpdate={updatePosition} image={images[item.name]} isGenerating={generatingId === item.name} />
                        ))}
                        {lastDiscovery && (
                            <div className="absolute top-8 right-8 left-8 md:left-auto md:w-80 animate-in slide-in-from-right-10 duration-1000 z-50">
                                <div className="glass p-6 rounded-[2.5rem] shadow-[0_30px_60px_rgba(0,0,0,0.8)] flex items-center gap-5 border border-white/10">
                                    <div className="p-3 bg-blue-500/20 rounded-full animate-pulse"><Icons.Zap /></div>
                                    <div>
                                        <p className="text-[8px] font-black text-blue-500/60 tracking-[0.4em] uppercase mb-1">New Origin Manifested</p>
                                        <h2 className="text-2xl font-black italic tracking-tighter uppercase leading-none">{lastDiscovery.name}</h2>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const DraggableElement = ({ item, allElements, onUpdate, image, isGenerating }) => {
            const [pos, setPos] = useState({ x: item.x, y: item.y });
            const [isDragging, setIsDragging] = useState(false);
            const dragStart = useRef({ x: 0, y: 0 });
            const isNearOther = allElements.some(other => other.instanceId !== item.instanceId && Math.abs(other.x - pos.x) < 80 && Math.abs(other.y - pos.y) < 80);

            const onStart = (e) => {
                setIsDragging(true);
                const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
                const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
                dragStart.current = { x: clientX - pos.x, y: clientY - pos.y };
            };

            const onMove = useCallback((e) => {
                if (!isDragging) return;
                const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
                const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
                setPos({ x: clientX - dragStart.current.x, y: clientY - dragStart.current.y });
            }, [isDragging]);

            const onEnd = () => {
                if (!isDragging) return;
                setIsDragging(false);
                onUpdate(item.instanceId, pos.x, pos.y);
            };

            useEffect(() => {
                if (isDragging) {
                    window.addEventListener('mousemove', onMove);
                    window.addEventListener('mouseup', onEnd);
                    window.addEventListener('touchmove', onMove, { passive: false });
                    window.addEventListener('touchend', onEnd);
                }
                return () => {
                    window.removeEventListener('mousemove', onMove);
                    window.removeEventListener('mouseup', onEnd);
                    window.removeEventListener('touchmove', onMove);
                    window.removeEventListener('touchend', onEnd);
                };
            }, [isDragging, onMove]);

            return (
                <div onMouseDown={onStart} onTouchStart={onStart} style={{ left: pos.x, top: pos.y, zIndex: isDragging ? 100 : 10, transform: isDragging ? 'scale(1.2)' : 'scale(1)', transition: isDragging ? 'none' : 'transform 0.6s cubic-bezier(0.16, 1, 0.3, 1)' }} className="absolute">
                    <div className="relative group flex flex-col items-center">
                        <div className={`absolute -inset-16 rounded-full bg-blue-500/5 blur-[60px] transition-opacity duration-700 ${isNearOther ? 'opacity-100 animate-pulse' : 'opacity-0'}`}></div>
                        <div className="glass p-4 rounded-[2.5rem] min-w-[90px] shadow-2xl ring-1 ring-white/5 transition-colors group-hover:border-white/20">
                            <div className="relative w-16 h-16 md:w-20 md:h-20 mb-3 flex items-center justify-center">
                                {image ? (
                                    <img src={image} className="w-full h-full object-contain rounded-2xl drop-shadow-[0_15px_30px_rgba(0,0,0,0.8)] origin-glow" alt={item.name} />
                                ) : isGenerating ? (
                                    <div className="text-blue-500"><Icons.Loader /></div>
                                ) : (
                                    <div className="scale-150 opacity-80">{item.icon}</div>
                                )}
                            </div>
                            <div className="text-center"><span className="text-[8px] font-black tracking-[0.3em] uppercase text-white/40">{item.name}</span></div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
