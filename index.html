    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: black;
            margin: 0;
            padding: 0;
            overflow: hidden;
            color: white;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .origin-glow {
            filter: drop-shadow(0 0 20px rgba(59, 130, 246, 0.4));
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.4; }
            50% { transform: scale(1.05); opacity: 0.2; }
            100% { transform: scale(0.95); opacity: 0.4; }
        }
        .pulse-aura {
            animation: pulse-ring 3s infinite ease-in-out;
        }
    </style>
</head>

                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="animate-spin text-blue-400">
                    <line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/>
                </svg>
            )
        };

        const createAudioEngine = () => {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            const ctx = new AudioContext();
            const masterGain = ctx.createGain();
            masterGain.gain.value = 0.12; 
            masterGain.connect(ctx.destination);

            return {
                spawn: () => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(330, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(110, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.4, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                    osc.connect(gain);
                    gain.connect(masterGain);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.15);
                },
                merge: () => {
                    const now = ctx.currentTime;
                    [220, 440, 880].forEach((freq, i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now + (i * 0.04));
                        gain.gain.setValueAtTime(0, now + (i * 0.04));
                        gain.gain.linearRampToValueAtTime(0.2, now + (i * 0.04) + 0.03);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                        osc.connect(gain);
                        gain.connect(masterGain);
                        osc.start(now + (i * 0.04));
                        osc.stop(now + 0.5);
                    });
                },
                clear: () => {
                    const bufferSize = ctx.sampleRate * 0.4;
                    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                    const noise = ctx.createBufferSource();
                    noise.buffer = buffer;
                    const filter = ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(800, ctx.currentTime);
                    filter.frequency.exponentialRampToValueAtTime(10, ctx.currentTime + 0.4);
                    const gain = ctx.createGain();
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(masterGain);
                    noise.start();
                },
                resume: () => {
                    if (ctx.state === 'suspended') ctx.resume();
                }
            };
        };

        const triggerHaptic = () => {
            if ('vibrate' in navigator) navigator.vibrate(12);
        };

        const apiKey = ""; 

        const INITIAL_ELEMENTS = [
            { id: 'fire', name: 'Fire', color: 'from-orange-600 to-red-600', description: 'The primal dance of heat and light.', value: 50 },
            { id: 'water', name: 'Water', color: 'from-blue-600 to-cyan-600', description: 'The essential fluid of existence.', value: 50 },
            { id: 'air', name: 'Air', color: 'from-slate-400 to-slate-200', description: 'The invisible breath of the world.', value: 50 },
            { id: 'earth', name: 'Earth', color: 'from-emerald-800 to-amber-900', description: 'The solid foundation of all things.', value: 50 },
        ];

        const COMBINATIONS = {
            'fire+water': { id: 'steam', name: 'Steam', description: 'Water heated to a gaseous state.', value: 200 },
            'fire+earth': { id: 'lava', name: 'Lava', description: 'Molten earth from the deep core.', value: 350 },
            'water+earth': { id: 'mud', name: 'Mud', description: 'A sticky union of moisture and soil.', value: 150 },
            'air+earth': { id: 'dust', name: 'Dust', description: 'Fine particles of broken stone.', value: 100 },
            'fire+air': { id: 'energy', name: 'Energy', description: 'Pure kinetic potential.', value: 500 },
            'water+air': { id: 'mist', name: 'Mist', description: 'A light, ghostly veil in the air.', value: 180 },
            'lava+water': { id: 'obsidian', name: 'Obsidian', description: 'Volcanic glass forged in shock.', value: 1200 },
            'steam+air': { id: 'cloud', name: 'Cloud', description: 'A visible mass of condensed vapor.', value: 400 },
            'earth+earth': { id: 'stone', name: 'Stone', description: 'Compressed mineral matter.', value: 120 },
            'fire+stone': { id: 'metal', name: 'Metal', description: 'Refined strength from the deep.', value: 1500 },
            'mud+fire': { id: 'brick', name: 'Brick', description: 'Baked earth shaped by intent.', value: 300 },
            'air+energy': { id: 'storm', name: 'Storm', description: 'The violent dance of nature.', value: 2200 },
            'water+energy': { id: 'life', name: 'Life', description: 'The sacred spark of animation.', value: 15000 },
            'life+earth': { id: 'plant', name: 'Plant', description: 'Life reaching upward from soil.', value: 3500 },
            'life+water': { id: 'algae', name: 'Algae', description: 'The simplest aquatic dance.', value: 2800 },
            'stone+stone': { id: 'mountain_range', name: 'Mountain Range', description: 'The spine of the world.', value: 8000 },
            'life+stone': { id: 'fossil', name: 'Fossil', description: 'An eternal memory of the past.', value: 25000 },
        };

        const App = () => {
            const [discovered, setDiscovered] = useState(INITIAL_ELEMENTS);
            const [workspace, setWorkspace] = useState([]);
            const [images, setImages] = useState({});
            const [generatingId, setGeneratingId] = useState(null);
            const [lastDiscovery, setLastDiscovery] = useState(null);
            const [activeInfo, setActiveInfo] = useState(null);
            const workspaceRef = useRef(null);
            const audio = useRef(null);

            useEffect(() => {
                audio.current = createAudioEngine();
            }, []);

            const generateVisual = async (elementName, retries = 5) => {
                if (images[elementName]) return;
                setGeneratingId(elementName);

                const executeRequest = async (attempt) => {
                    try {
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                instances: { 
                                    prompt: `High-resolution cinematic 3D macro render of '${elementName}'. Dark atmospheric background, artistic lighting, octane render style, magical artifact texture, 8k resolution.` 
                                },
                                parameters: { sampleCount: 1 }
                            })
                        });
                        if (!response.ok) throw new Error('Generation failed');
                        const result = await response.json();
                        if (result.predictions?.[0]?.bytesBase64Encoded) {
                            return `data:image/png;base64,${result.predictions[0].bytesBase64Encoded}`;
                        }
                        throw new Error('No image');
                    } catch (e) {
                        if (attempt < retries) {
                            await new Promise(r => setTimeout(r, Math.pow(2, attempt) * 1000));
                            return executeRequest(attempt + 1);
                        }
                        throw e;
                    }
                };

                try {
                    const imageUrl = await executeRequest(0);
                    setImages(prev => ({ ...prev, [elementName]: imageUrl }));
                } catch (e) { console.error(e); }
                finally { setGeneratingId(null); }
            };

            const addInstance = (element) => {
                audio.current?.resume();
                audio.current?.spawn();
                setActiveInfo(element);
                
                const rect = workspaceRef.current?.getBoundingClientRect();
                const spawnX = rect ? (rect.width - 120) - (Math.random() * 20) : 300;
                const spawnY = rect ? (Math.random() * (rect.height - 180)) + 80 : 150;
                
                const newItem = {
                    ...element,
                    instanceId: Math.random().toString(36).substr(2, 9),
                    x: spawnX,
                    y: spawnY,
                };
                setWorkspace(prev => [...prev, newItem]);
            };

            const removeInstance = (id) => {
                audio.current?.clear();
                setWorkspace(prev => prev.filter(i => i.instanceId !== id));
                setActiveInfo(null);
            };

            const handleMerge = (movedItem, currentWorkspace) => {
                const target = currentWorkspace.find(item => 
                    item.instanceId !== movedItem.instanceId && 
                    Math.abs(item.x - movedItem.x) < 80 && 
                    Math.abs(item.y - movedItem.y) < 80
                );

                if (target) {
                    const key1 = `${movedItem.id}+${target.id}`;
                    const key2 = `${target.id}+${movedItem.id}`;
                    const result = COMBINATIONS[key1] || COMBINATIONS[key2];

                    if (result) {
                        audio.current?.merge();
                        const isNew = !discovered.find(e => e.id === result.id);
                        const newElem = { ...result, color: 'from-blue-600 to-indigo-600' };
                        
                        if (isNew) {
                            setDiscovered(prev => [...prev, newElem]);
                            generateVisual(newElem.name);
                            setLastDiscovery(newElem);
                            triggerHaptic();
                            setTimeout(() => setLastDiscovery(null), 4000);
                        }

                        setActiveInfo(newElem);
                        const centerX = (movedItem.x + target.x) / 2;
                        const centerY = (movedItem.y + target.y) / 2;
                        
                        setWorkspace(prev => prev.filter(i => i.instanceId !== movedItem.instanceId && i.instanceId !== target.instanceId));
                        setWorkspace(prev => [...prev, {
                            ...newElem,
                            instanceId: Math.random().toString(36).substr(2, 9),
                            x: centerX,
                            y: centerY
                        }]);
                        return true;
                    }
                }
                return false;
            };

            const updatePosition = (id, x, y) => {
                setWorkspace(prev => {
                    const updated = prev.map(item => item.instanceId === id ? { ...item, x, y } : item);
                    const movedItem = updated.find(i => i.instanceId === id);
                    if (movedItem) handleMerge(movedItem, updated);
                    return updated;
                });
            };

            return (
                <div className="flex h-screen w-screen bg-black text-white overflow-hidden select-none touch-none" onClick={() => audio.current?.resume()}>
                    
                    {/* Library Sidebar - Title Removed */}
                    <aside className="w-16 md:w-24 bg-zinc-950 border-r border-white/5 flex flex-col items-center z-50 overflow-hidden shadow-2xl">
                        
                        {/* Simple Icon Header instead of title */}
                        <div className="py-8 border-b border-white/5 w-full flex flex-col items-center">
                            <Icons.globe />
                        </div>

                        {/* Scrollable Element List */}
                        <div className="flex-1 overflow-y-auto w-full py-6 flex flex-col items-center gap-5 no-scrollbar">
                            {discovered.map((element) => (
                                <button key={element.id} onClick={() => addInstance(element)} className="flex flex-col items-center gap-1 active:scale-90 transition-transform group">
                                    <div className="w-10 h-10 md:w-14 md:h-14 bg-white/[0.03] border border-white/10 rounded-xl flex items-center justify-center group-hover:bg-white/10 overflow-hidden relative">
                                        {images[element.name] ? (
                                            <img src={images[element.name]} className="w-full h-full object-cover origin-glow" alt={element.name} />
                                        ) : (
                                            <div className="opacity-60 group-hover:opacity-100 transition-opacity scale-110">
                                                {Icons[element.id] ? Icons[element.id]() : Icons.globe()}
                                            </div>
                                        )}
                                        {generatingId === element.name && (
                                            <div className="absolute inset-0 bg-black/70 flex items-center justify-center"><Icons.loader /></div>
                                        )}
                                    </div>
                                    <span className="text-[6px] md:text-[8px] font-black tracking-widest uppercase text-zinc-600 group-hover:text-blue-400 truncate max-w-full px-1">{element.name}</span>
                                </button>
                            ))}
                        </div>
                        
                        <div className="mt-auto py-6 border-t border-white/5 w-full flex flex-col items-center">
                            <button onClick={() => setWorkspace([])} className="p-2 text-zinc-800 hover:text-red-500 transition-colors">
                                <Icons.trash />
                            </button>
                        </div>
                    </aside>

                    {/* Main Stage */}
                    <main ref={workspaceRef} className="flex-1 relative bg-[radial-gradient(circle_at_50%_50%,_#0a0a0c_0%,_#000_100%)] overflow-hidden">
                        <div className="absolute inset-0 opacity-[0.02] pointer-events-none" style={{ backgroundImage: 'radial-gradient(rgb(255,255,255) 1px, transparent 1px)', backgroundSize: '40px 40px' }}></div>
                        
                        {/* Title strictly in the right margin stage area */}
                        <div className="absolute top-8 left-8 pointer-events-none opacity-20">
                            <h1 className="text-2xl font-black italic tracking-tighter uppercase text-white">LIFE & ORIGINS</h1>
                        </div>

                        {workspace.length === 0 && (
                            <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none px-12 text-center opacity-10">
                                <div className="w-32 h-32 rounded-full border border-white/5 flex items-center justify-center mb-6">
                                    <Icons.globe />
                                </div>
                                <p className="text-[9px] font-black tracking-[0.5em] uppercase px-8">Manifest an element to begin transmutation</p>
                            </div>
                        )}

                        {workspace.map((item) => (
                            <DraggableElement key={item.instanceId} item={item} allElements={workspace} onUpdate={updatePosition} onRemove={() => removeInstance(item.instanceId)} image={images[item.name]} isGenerating={generatingId === item.name} onFocus={() => setActiveInfo(item)} />
                        ))}

                        {/* Info Intel Panel */}
                        {activeInfo && (
                            <div className="absolute bottom-10 left-10 right-28 md:left-auto md:w-80 animate-in slide-in-from-bottom-10 duration-500 z-50 pointer-events-none">
                                <div className="glass p-6 rounded-[2.5rem] shadow-[0_25px_50px_rgba(0,0,0,0.8)] border border-white/10 relative overflow-hidden pointer-events-auto">
                                    <button onClick={() => setActiveInfo(null)} className="absolute top-4 right-4 text-zinc-500 hover:text-white">✕</button>
                                    <div className="flex items-center gap-4 mb-3">
                                        <div className="w-12 h-12 bg-white/5 rounded-2xl flex items-center justify-center">
                                            {images[activeInfo.name] ? (
                                                <img src={images[activeInfo.name]} className="w-full h-full object-contain rounded-xl" />
                                            ) : (
                                                <div className="scale-125">
                                                    {Icons[activeInfo.id] ? Icons[activeInfo.id]() : Icons.globe()}
                                                </div>
                                            )}
                                        </div>
                                        <div>
                                            <h3 className="text-xl font-black italic uppercase tracking-tighter">{activeInfo.name}</h3>
                                            <p className="text-[10px] font-mono text-emerald-400 font-bold">{activeInfo.value.toLocaleString()} AED</p>
                                        </div>
                                    </div>
                                    <p className="text-[10px] text-zinc-400 leading-relaxed font-medium uppercase tracking-widest">{activeInfo.description}</p>
                                </div>
                            </div>
                        )}

                        {/* Discovery Card Overlay */}
                        {lastDiscovery && (
                            <div className="absolute top-10 left-10 right-10 md:left-auto md:right-10 md:w-96 animate-in slide-in-from-right-10 duration-1000 z-50">
                                <div className="glass p-8 rounded-[3rem] shadow-[0_40px_80px_rgba(0,0,0,0.9)] flex flex-col gap-4 border border-blue-500/20 relative">
                                    <div className="absolute -inset-1 bg-blue-500/5 blur-2xl pulse-aura rounded-full" />
                                    <div className="flex items-center gap-5 relative">
                                        <div className="p-4 bg-blue-500/20 rounded-full">
                                            {Icons[lastDiscovery.id] ? Icons[lastDiscovery.id]() : Icons.globe()}
                                        </div>
                                        <div>
                                            <p className="text-[9px] font-black text-blue-500 tracking-[0.5em] uppercase mb-1">Origin Unlocked</p>
                                            <h2 className="text-3xl font-black italic tracking-tighter uppercase leading-none">{lastDiscovery.name}</h2>
                                        </div>
                                    </div>
                                    <p className="text-xs text-zinc-300 font-medium italic opacity-80 pl-2">"{lastDiscovery.description}"</p>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const DraggableElement = ({ item, allElements, onUpdate, onRemove, image, isGenerating, onFocus }) => {
            const [pos, setPos] = useState({ x: item.x, y: item.y });
            const [isDragging, setIsDragging] = useState(false);
            const dragStart = useRef({ x: 0, y: 0 });
            const isNearOther = allElements.some(other => other.instanceId !== item.instanceId && Math.abs(other.x - pos.x) < 80 && Math.abs(other.y - pos.y) < 80);

            const onStart = (e) => {
                setIsDragging(true);
                onFocus();
                const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
                const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
                dragStart.current = { x: clientX - pos.x, y: clientY - pos.y };
            };

            const onMove = useCallback((e) => {
                if (!isDragging) return;
                const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
                const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
                setPos({ x: clientX - dragStart.current.x, y: clientY - dragStart.current.y });
            }, [isDragging]);

            const onEnd = () => {
                if (!isDragging) return;
                setIsDragging(false);
                onUpdate(item.instanceId, pos.x, pos.y);
            };

            useEffect(() => {
                if (isDragging) {
                    window.addEventListener('mousemove', onMove);
                    window.addEventListener('mouseup', onEnd);
                    window.addEventListener('touchmove', onMove, { passive: false });
                    window.addEventListener('touchend', onEnd);
                }
                return () => {
                    window.removeEventListener('mousemove', onMove);
                    window.removeEventListener('mouseup', onEnd);
                    window.removeEventListener('touchmove', onMove);
                    window.removeEventListener('touchend', onEnd);
                };
            }, [isDragging, onMove]);

            return (
                <div onMouseDown={onStart} onTouchStart={onStart} style={{ left: pos.x, top: pos.y, zIndex: isDragging ? 100 : 10, transform: isDragging ? 'scale(1.15)' : 'scale(1)', transition: isDragging ? 'none' : 'transform 0.6s cubic-bezier(0.16, 1, 0.3, 1)' }} className="absolute">
                    <div className="relative group flex flex-col items-center">
                        <div className={`absolute -inset-14 rounded-full bg-blue-500/5 blur-[50px] transition-opacity duration-700 ${isNearOther ? 'opacity-100 animate-pulse' : 'opacity-0'}`}></div>
                        
                        <button 
                            onMouseDown={(e) => e.stopPropagation()} 
                            onTouchStart={(e) => e.stopPropagation()}
                            onClick={(e) => { e.stopPropagation(); onRemove(); }}
                            className="absolute -left-1 -top-1 w-6 h-6 rounded-full glass border border-white/10 flex items-center justify-center z-20 opacity-0 group-hover:opacity-100 transition-opacity active:scale-90 text-zinc-400 hover:text-white"
                        >
                            <Icons.back />
                        </button>

                        <div className="glass p-4 rounded-[2.2rem] min-w-[85px] shadow-2xl ring-1 ring-white/5 transition-all group-hover:border-white/20">
                            <div className="relative w-14 h-14 md:w-16 md:h-16 mb-2 flex items-center justify-center">
                                {image ? (
                                    <img src={image} className="w-full h-full object-contain rounded-xl drop-shadow-[0_12px_25px_rgba(0,0,0,0.8)] origin-glow" alt={item.name} />
                                ) : isGenerating ? (
                                    <div className="text-blue-500"><Icons.loader /></div>
                                ) : (
                                    <div className="scale-125 opacity-70">
                                        {Icons[item.id] ? Icons[item.id]() : Icons.globe()}
                                    </div>
                                )}
                            </div>
                            <div className="text-center"><span className="text-[7px] font-black tracking-[0.2em] uppercase text-white/30">{item.name}</span></div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
